<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI规划 - AP Planner</title>
    <link rel="stylesheet" href="layout.css">
    <style>
        .content-wrap {
            max-width: 980px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 22px;
        }

        .page-header h1 {
            font-size: 28px;
            margin: 0 0 8px;
        }

        .page-header p {
            margin: 0;
            color: #6b7b8c;
            font-size: 15px;
        }

        .chat-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e8eef4;
        }

        .chat-window {
            min-height: 420px;
            max-height: 520px;
            overflow-y: auto;
            padding: 22px;
            background: #fbfcfe;
        }

        .message {
            margin-bottom: 16px;
            line-height: 1.7;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .message.user {
            text-align: right;
        }

        .bubble {
            display: inline-block;
            max-width: 78%;
            padding: 12px 14px;
            border-radius: 8px;
            text-align: left;
        }

        .message.user .bubble {
            background: #2f6f9f;
            color: white;
        }

        .message.assistant .bubble {
            background: white;
            color: #2c3e50;
            border: 1px solid #e9eef3;
        }

        .chat-input {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            padding: 16px;
            border-top: 1px solid #eef1f4;
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 72px;
            border: 1px solid #dce3ea;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #2f6f9f;
            outline: none;
            box-shadow: 0 0 0 3px rgba(47,111,159,0.12);
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 0 22px;
            background: #2f6f9f;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        button:hover {
            background: #245d87;
        }

        button:disabled {
            background: #9aa9b7;
            cursor: not-allowed;
        }

        .hint-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .hint-btn {
            border: 1px solid #dce9f6;
            background: #ffffff;
            color: #2c3e50;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .hint-btn:hover {
            background: #e8f2fa;
        }

        @media (max-width: 800px) {
            .chat-input {
                grid-template-columns: 1fr;
            }

            button {
                min-height: 42px;
            }

            .bubble {
                max-width: 94%;
            }
        }
    </style>
</head>
<body>
<header id="app-topbar" class="app-topbar"></header>
<div class="app-shell">
<aside id="app-sidebar" class="app-sidebar"></aside>
<main class="page-content">
    <div class="content-wrap">
        <section class="page-header">
            <h1>AI规划</h1>
            <p>围绕 AP 选课、GPA、标化、活动背景和院校申请进行专项对话。新成绩和经历会自动同步到Profile库。</p>
        </section>

        <div class="hint-list">
            <button class="hint-btn" onclick="usePrompt('我现在的AP课程还需要补哪些？')">AP选课建议</button>
            <button class="hint-btn" onclick="usePrompt('请根据我的Profile生成一份升学规划。')">生成规划报告</button>
            <button class="hint-btn" onclick="usePrompt('我的活动背景应该怎么提升？')">活动背景提升</button>
            <button class="hint-btn" onclick="usePrompt('我适合申请哪些层次的学校？')">院校层次判断</button>
            <button class="hint-btn" onclick="usePrompt('我新增了 AP Calculus BC 5分，请更新我的规划。')">同步新成绩</button>
        </div>

        <section class="chat-card">
            <div id="chat-window" class="chat-window">
                <div class="message assistant">
                    <div class="bubble">你好，我是 AP Planner 的升学规划 AI 顾问。你可以问我 AP 选课、GPA、标化、活动背景、目标专业和院校匹配相关问题。你也可以直接告诉我新成绩或新活动，我会尝试写入Profile库并重新判断优先级。</div>
                </div>
            </div>

            <div class="chat-input">
                <textarea id="chat-message" placeholder="例如：我想申请计算机专业，现在应该补哪些AP和活动？"></textarea>
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </section>
    </div>
</main>
</div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script>
let currentToken = "";

function appendMessage(role, text) {
    const chatWindow = document.getElementById("chat-window");
    const message = document.createElement("div");
    message.className = `message ${role}`;
    const content = role === "assistant" ? formatPlanningText(text) : escapeHtml(text);
    message.innerHTML = `<div class="bubble">${content}</div>`;
    chatWindow.appendChild(message);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

function escapeHtml(text) {
    return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatPlanningText(text) {
    return escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
}

function usePrompt(text) {
    document.getElementById("chat-message").value = text;
}

async function sendMessage() {
    const input = document.getElementById("chat-message");
    const btn = document.getElementById("send-btn");
    const text = input.value.trim();

    if (!text) {
        return;
    }

    appendMessage("user", text);
    input.value = "";
    btn.disabled = true;
    btn.textContent = "生成中...";

    try {
        const response = await fetch(`${AUTH_BASE_URL}/api/ai-chat`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${currentToken}`
            },
            body: JSON.stringify({ message: text })
        });
        const result = await response.json();

        if (result.code !== 200) {
            appendMessage("assistant", result.msg || "AI暂时无法回答，请稍后重试。");
            return;
        }

        appendMessage("assistant", result.data.answer);
        if (result.data.detected_updates && result.data.detected_updates.length) {
            localStorage.removeItem("profileData");
        }
    } catch (error) {
        appendMessage("assistant", "网络错误，请检查后端服务是否启动。");
    } finally {
        btn.disabled = false;
        btn.textContent = "发送";
    }
}

requireLogin((user, token) => {
    currentToken = token;
    renderAppLayout(user);
});
</script>
</body>
</html>
