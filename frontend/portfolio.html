<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - AP Planner</title>
    <link rel="stylesheet" href="layout.css">
    <style>
        .content-wrap {
            max-width: 1080px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 22px;
        }

        .page-header h1 {
            font-size: 28px;
            margin: 0 0 8px;
        }

        .page-header p {
            margin: 0;
            color: #6b7b8c;
            font-size: 15px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 16px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e8eef4;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            padding: 22px;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 18px;
            margin: 0 0 14px;
        }

        .data-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .data-list li {
            border-bottom: 1px solid #eef1f4;
            color: #536475;
            font-size: 14px;
            line-height: 1.6;
            padding: 11px 0;
        }

        .data-list li:last-child {
            border-bottom: none;
        }

        .field-label {
            color: #506172;
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        textarea {
            min-height: 120px;
            padding: 12px;
            resize: vertical;
        }

        .primary-btn {
            border: none;
            background: #2f6f9f;
            color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            margin-top: 12px;
            padding: 11px 16px;
        }

        .primary-btn:hover {
            background: #245d87;
        }

        .message {
            color: #6b7b8c;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 10px;
            min-height: 18px;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: #e8f2fa;
            color: #2f6f9f;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .portfolio-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
<link rel="preload" href="assets/fonts/NotebookHan-Common.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/handwriting.css?v=2">
<link rel="stylesheet" href="notebook.css?v=sheet-4-timeline">
<script src="notebook.js?v=sheet-2" defer></script>
</head>
<body data-notebook-page="portfolio">
<header id="app-topbar" class="app-topbar"></header>
<div class="app-shell">
<aside id="app-sidebar" class="app-sidebar"></aside>
<main class="page-content">
    <div class="content-wrap">
        <section class="page-header">
            <h1>Portfolio</h1>
            <p>Your courses, interests, activities, research and volunteering. New details from AI Planner appear here.</p>
        </section>

        <div class="portfolio-grid">
            <section>
                <div class="card">
                    <h2>AP courses &amp; interests</h2>
                    <ul id="course-list" class="data-list">
                        <li>Loading course records...</li>
                    </ul>
                </div>

                <div class="card">
                    <h2>Experience</h2>
                    <ul id="experience-list" class="data-list">
                        <li>Loading experience...</li>
                    </ul>
                </div>
            </section>

            <aside>
                <div class="card">
                    <h2>Profile tags</h2>
                    <div id="profile-tags" class="tag-row">
                        <span class="tag">Loading...</span>
                    </div>
                </div>

                <div class="card">
                    <h2>Quick update</h2>
                    <label class="field-label" for="quick-note">New score or experience</label>
                    <textarea id="quick-note" placeholder="e.g. I scored 5 in AP Psychology, or I joined a psychology volunteering project."></textarea>
                    <button id="sync-btn" class="primary-btn" onclick="syncNote()">Update portfolio</button>
                    <div id="sync-msg" class="message"></div>
                </div>
            </aside>
        </div>
    </div>
</main>
</div>

<script src="auth.js"></script>
<script src="layout.js"></script>
<script>
let currentToken = "";

function escapeHtml(text) {
    return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function renderProfile(profile, analysis) {
    const apCourses = (profile.apCourses || []).filter(item => item.course);
    const interests = profile.courseInterests || [];
    const courseItems = [
        ...apCourses.map(item => `AP：${item.course}，分数/目标 ${item.score || "暂未出分"}`),
        ...interests.map(item => `课程兴趣：${item}`)
    ];
    document.getElementById("course-list").innerHTML = courseItems.length
        ? courseItems.map(item => `<li>${escapeHtml(item)}</li>`).join("")
        : "<li>暂无课程记录。</li>";

    const portfolio = profile.portfolio || {};
    const experienceItems = [];
    if (profile.activity && profile.activity.description) {
        experienceItems.push(`${profile.activity.type || "活动"}：${profile.activity.description}`);
    }
    Object.keys(portfolio).forEach(bucket => {
        (portfolio[bucket] || []).forEach(item => {
            experienceItems.push(`${bucket}：${item}`);
        });
    });
    document.getElementById("experience-list").innerHTML = experienceItems.length
        ? experienceItems.map(item => `<li>${escapeHtml(item)}</li>`).join("")
        : "<li>暂无背景经历。可以用右侧快速同步添加。</li>";

    document.getElementById("profile-tags").innerHTML = [
        analysis.profile.majorTrack,
        analysis.profile.gpaStatus.status,
        analysis.profile.languageStatus.status,
        `${analysis.profile.apCount}门AP`
    ].map(item => `<span class="tag">${escapeHtml(item)}</span>`).join("");
}

async function loadData() {
    const [profileResponse, analysisResponse] = await Promise.all([
        fetch(`${AUTH_BASE_URL}/api/profile/me`, {
            headers: { "Authorization": `Bearer ${currentToken}` }
        }),
        fetch(`${AUTH_BASE_URL}/api/planning/analysis`, {
            headers: { "Authorization": `Bearer ${currentToken}` }
        })
    ]);
    const profileResult = await profileResponse.json();
    const analysisResult = await analysisResponse.json();

    if (profileResult.code === 200 && analysisResult.code === 200) {
        renderProfile(profileResult.data, analysisResult.data);
    }
}

async function syncNote() {
    const textarea = document.getElementById("quick-note");
    const button = document.getElementById("sync-btn");
    const message = document.getElementById("sync-msg");
    const text = textarea.value.trim();

    if (!text) {
        message.textContent = "请先输入要同步的成绩或经历。";
        return;
    }

    button.disabled = true;
    button.textContent = "同步中...";
    message.textContent = "";

    try {
        const response = await fetch(`${AUTH_BASE_URL}/api/ai-chat`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${currentToken}`
            },
            body: JSON.stringify({ message: text })
        });
        const result = await response.json();
        if (result.code !== 200) {
            message.textContent = result.msg || "同步失败。";
            return;
        }

        const updates = result.data.detected_updates || [];
        message.textContent = updates.length ? `已同步：${updates.join("；")}` : "已记录对话，但没有识别到结构化资料。";
        textarea.value = "";
        await loadData();
    } catch (error) {
        message.textContent = "网络错误，请检查后端服务是否启动。";
    } finally {
        button.disabled = false;
        button.textContent = "写入背景库";
    }
}

requireLogin((user, token) => {
    currentToken = token;
    renderAppLayout(user);
    loadData();
});
</script>
</body>
</html>
