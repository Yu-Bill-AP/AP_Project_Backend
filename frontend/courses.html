<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP课程库 - AP Planner</title>
    <link rel="stylesheet" href="layout.css">
    <style>
        .content-wrap {
            max-width: 1080px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 22px;
        }

        .page-header h1 {
            font-size: 28px;
            margin: 0 0 8px;
        }

        .page-header p {
            margin: 0;
            color: #6b7b8c;
            font-size: 15px;
        }

        .toolbar {
            background: #ffffff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 12px;
            align-items: end;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #506172;
            font-size: 13px;
            font-weight: 700;
        }

        .field input,
        .field select {
            width: 100%;
            height: 42px;
            border: 1px solid #dce5ee;
            border-radius: 8px;
            padding: 0 12px;
            color: #2c3e50;
            font-size: 14px;
            background: #ffffff;
            outline: none;
        }

        .field input:focus,
        .field select:focus {
            border-color: #2f6f9f;
            box-shadow: 0 0 0 3px rgba(47,111,159,0.12);
        }

        .summary-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .summary-card {
            background: #ffffff;
            border: 1px solid #e8eef4;
            border-radius: 8px;
            padding: 14px 16px;
        }

        .summary-card span {
            display: block;
            color: #6b7b8c;
            font-size: 12px;
            font-weight: 700;
        }

        .summary-card strong {
            display: block;
            margin-top: 6px;
            color: #2c3e50;
            font-size: 22px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .course-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #eef2f6;
        }

        .course-card h2 {
            font-size: 18px;
            margin: 0 0 10px;
        }

        .course-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tag {
            background: #e8f2fa;
            color: #2f6f9f;
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 12px;
            font-weight: 700;
        }

        .tag.difficulty-high {
            background: #fff1f0;
            color: #c0392b;
        }

        .tag.difficulty-medium {
            background: #fff8e6;
            color: #9a6700;
        }

        .tag.difficulty-low {
            background: #edf8f1;
            color: #207a45;
        }

        .course-card p {
            color: #5d6d7e;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .course-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #eef2f6;
        }

        .detail-item span {
            display: block;
            color: #7b8a99;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .detail-item strong {
            color: #34495e;
            font-size: 13px;
            line-height: 1.4;
        }

        .empty-state {
            display: none;
            background: #ffffff;
            border-radius: 8px;
            padding: 28px;
            color: #6b7b8c;
            text-align: center;
            border: 1px solid #e8eef4;
        }

        @media (max-width: 900px) {
            .toolbar,
            .summary-row,
            .course-grid {
                grid-template-columns: 1fr;
            }

            .course-detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header id="app-topbar" class="app-topbar"></header>
<div class="app-shell">
<aside id="app-sidebar" class="app-sidebar"></aside>
<main class="page-content">
    <div class="content-wrap">
        <section class="page-header">
            <h1>AP课程库</h1>
            <p>基于 College Board AP Central 官方科目清单整理，按方向查看课程难度、适合专业和申请价值。</p>
        </section>

        <section class="toolbar" aria-label="课程筛选">
            <div class="field">
                <label for="course-search">搜索课程</label>
                <input id="course-search" type="search" placeholder="输入课程名、方向或关键词">
            </div>
            <div class="field">
                <label for="track-filter">方向分类</label>
                <select id="track-filter">
                    <option value="全部">全部方向</option>
                    <option value="计算机">计算机</option>
                    <option value="工程">工程</option>
                    <option value="商科">商科/经济</option>
                    <option value="社科">社科/人文</option>
                    <option value="生物医学">生物医学</option>
                    <option value="艺术">艺术</option>
                    <option value="语言">世界语言</option>
                    <option value="研究能力">Capstone/研究</option>
                    <option value="职业技能">职业技能</option>
                </select>
            </div>
            <div class="field">
                <label for="difficulty-filter">课程难度</label>
                <select id="difficulty-filter">
                    <option value="全部">全部难度</option>
                    <option value="高">高</option>
                    <option value="中高">中高</option>
                    <option value="中">中</option>
                </select>
            </div>
        </section>

        <section class="summary-row" aria-label="课程统计">
            <div class="summary-card">
                <span>当前结果</span>
                <strong id="result-count">0</strong>
            </div>
            <div class="summary-card">
                <span>高难课程</span>
                <strong id="high-count">0</strong>
            </div>
            <div class="summary-card">
                <span>STEM相关</span>
                <strong id="stem-count">0</strong>
            </div>
            <div class="summary-card">
                <span>推荐搭配</span>
                <strong id="combo-count">0</strong>
            </div>
        </section>

        <section id="course-grid" class="course-grid"></section>
        <section id="empty-state" class="empty-state">没有找到匹配课程，请调整搜索或筛选条件。</section>
    </div>
</main>
</div>

<script src="auth.js"></script>
<script src="layout.js"></script>

function getDifficultyClass(difficulty) {
    if (difficulty === "高") {
        return "difficulty-high";
    }
    if (difficulty === "中高") {
        return "difficulty-medium";
    }
    return "difficulty-low";
}

function isStemCourse(course) {
    return course.tracks.some(track => ["计算机", "工程", "生物医学"].includes(track));
}

function renderCourses(courses) {
    const grid = document.getElementById("course-grid");
    const emptyState = document.getElementById("empty-state");

    grid.innerHTML = courses.map(course => `
        <article class="course-card">
            <h2>${course.name}</h2>
            <div class="course-meta">
                <span class="tag ${getDifficultyClass(course.difficulty)}">难度 ${course.difficulty}</span>
                ${course.tracks.map(track => `<span class="tag">${track}</span>`).join("")}
            </div>
            <p>${course.description}</p>
            <div class="course-detail">
                <div class="detail-item">
                    <span>申请价值</span>
                    <strong>${course.value}</strong>
                </div>
                <div class="detail-item">
                    <span>建议搭配</span>
                    <strong>${course.combo}</strong>
                </div>
                <div class="detail-item">
                    <span>建议时间</span>
                    <strong>${course.timing}</strong>
                </div>
                <div class="detail-item">
                    <span>官方分类 / 适配方向</span>
                    <strong>${course.category} / ${course.tracks.join(" / ")}</strong>
                </div>
            </div>
        </article>
    `).join("");

    emptyState.style.display = courses.length ? "none" : "block";
}

function updateSummary(courses) {
    document.getElementById("result-count").textContent = courses.length;
    document.getElementById("high-count").textContent = courses.filter(course => course.difficulty === "高").length;
    document.getElementById("stem-count").textContent = courses.filter(isStemCourse).length;
    document.getElementById("combo-count").textContent = courses.filter(course => course.combo).length;
}

function filterCourses() {
    const keyword = document.getElementById("course-search").value.trim().toLowerCase();
    const track = document.getElementById("track-filter").value;
    const difficulty = document.getElementById("difficulty-filter").value;

    const courses = AP_COURSES.filter(course => {
        const text = [
            course.name,
            course.category,
            course.difficulty,
            course.value,
            course.combo,
            course.description,
            course.tracks.join(" ")
        ].join(" ").toLowerCase();
        const matchKeyword = !keyword || text.includes(keyword);
        const matchTrack = track === "全部"
            || course.tracks.includes(track)
            || (track === "社科" && course.tracks.includes("人文"));
        const matchDifficulty = difficulty === "全部" || course.difficulty === difficulty;

        return matchKeyword && matchTrack && matchDifficulty;
    });

    renderCourses(courses);
    updateSummary(courses);
}

function initCourseLibrary() {
    document.getElementById("course-search").addEventListener("input", filterCourses);
    document.getElementById("track-filter").addEventListener("change", filterCourses);
    document.getElementById("difficulty-filter").addEventListener("change", filterCourses);
    filterCourses();
}

requireLogin((user) => {
    renderAppLayout(user);
    initCourseLibrary();
});
