<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Application guide - AP Planner</title><link rel="stylesheet" href="layout.css"><style>
:root{--ink:#193043;--muted:#64778a;--line:#dfe8ef;--blue:#17689e}.content-wrap{max-width:1120px;margin:0 auto}.hero{padding:28px;border-radius:16px;background:linear-gradient(125deg,#153a57,#17689e);color:#fff}.hero p{margin:0 0 8px;font-size:12px;letter-spacing:.1em;opacity:.76}.hero h1{margin:0;font-size:29px}.hero>div{margin-top:10px;color:#e4f1f8;font-size:14px;line-height:1.65}.guide-nav{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.guide-nav button{border:1px solid var(--line);border-radius:999px;background:#fff;color:#466277;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}.guide-nav button.active,.guide-nav button:hover{border-color:var(--blue);background:#edf7fc;color:#17689e}.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.guide-card{padding:20px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 4px 15px rgba(22,49,72,.035)}.guide-card.wide{grid-column:1/-1}.guide-card h2{margin:0 0 8px;font-size:18px}.guide-card p{margin:0;color:#556e80;font-size:13px;line-height:1.65}.guide-card ul{margin:12px 0 0;padding-left:19px;color:#4e6678;font-size:13px;line-height:1.75}.guide-card li+li{margin-top:4px}.tag{display:inline-block;margin:0 6px 7px 0;padding:4px 8px;border-radius:999px;background:#edf5f9;color:#33709a;font-size:11px;font-weight:700}.callout{margin-top:13px;padding:11px 12px;border-left:3px solid #75b6d9;border-radius:6px;background:#f4f9fc;color:#456477;font-size:13px;line-height:1.6}.link{display:inline-block;margin-top:13px;color:#17689e;font-size:13px;font-weight:700;text-decoration:none}.link:hover{text-decoration:underline}.empty{padding:30px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;color:var(--muted)}@media(max-width:760px){.hero{padding:22px}.guide-grid{grid-template-columns:1fr}.guide-card.wide{grid-column:auto}}
</style><link rel="preload" href="assets/fonts/NotebookHan-Common.woff2" as="font" type="font/woff2" crossorigin>

</head><body data-notebook-page="guide"><header id="app-topbar" class="app-topbar"></header><div class="app-shell"><aside id="app-sidebar" class="app-sidebar"></aside><main class="page-content"><div class="content-wrap"><section class="hero"><p>PERSONALIZED ADMISSIONS PLAYBOOK</p><h1>Application guide</h1><div id="guide-intro">Loading your profile, course plan and timeline...</div></section><nav class="guide-nav" id="guide-nav"><button class="active" data-topic="all">All</button><button data-topic="academic">Academics &amp; AP</button><button data-topic="tests">Tests &amp; English</button><button data-topic="profile">Activities &amp; materials</button><button data-topic="schools">Universities &amp; applications</button></nav><section id="guide-grid" class="guide-grid"><div class="empty">Loading your guide...</div></section></div></main></div><script src="auth.js"></script><script src="layout.js"></script><script>
let guideCards=[];function e(value){return escapeHtml(value||"")}function card(topic,title,body,wide=false){return{topic,title,body,wide}}function list(items){return `<ul>${items.map(item=>`<li>${e(item)}</li>`).join("")}</ul>`}function renderGuide(topic="all"){const cards=topic==="all"?guideCards:guideCards.filter(card=>card.topic===topic);$("guide-grid").innerHTML=cards.length?cards.map(item=>`<article class="guide-card ${item.wide?"wide":""}"><h2>${e(item.title)}</h2>${item.body}</article>`).join(""):'<div class="empty">这个主题暂时没有额外内容。</div>'}function $(id){return document.getElementById(id)}function buildGuide(profile,analysis,timeline){const track=analysis.profile.majorTrack||"未确定";const language=analysis.profile.languageStatus||{};const plan=analysis.coursePlan||{};const ap=(profile.apCourses||[]).filter(item=>item.course);const context=profile.applicationContext||{};const timelineFocus=timeline.summary.topFocus;const schoolNotes=(timeline.tracks.find(track=>track.id==="application")||{}).tasks||[];guideCards=[card("academic","你的学术主线",`<p>当前目标方向是 <strong>${e(track)}</strong>。课程组合应服务于方向证明，同时保护 GPA，而不是单纯追求 AP 数量。</p>${list([`已记录 ${ap.length} 门 AP；已纳入核心：${(plan.includedCore||[]).join("、")||"暂无"}`,`下一步可评估：${(plan.core||[]).slice(0,3).join("、")||"先完善 AP 与目标专业"}`,plan.loadAdvice||"按可持续负担安排课程强度。"])}<a class="link" href="courses.html">查看课程库与个性化权重 →</a>`),card("academic","怎么判断一门 AP 值不值得上",`<p>用“方向相关度、前置基础、校内课程负担、个人兴趣/信心”四项一起判断。</p>${list(["优先补强目标专业的核心能力，不重复堆同类课。","如果个人课程评价显示适配度低，先比较系统给出的替代课。","在 GPA 不稳定时，减少高风险新增 AP 是更成熟的策略。"])}`),card("tests","英语与标化：先分清成绩的用途",`<p>当前英语记录：<strong>${e(language.label||"未填写")}</strong>。正式出分可用于院校门槛核验；模考和预估只用于制定计划。</p>${list(["在申请档案中录入总分、小分、考试版本和计划日期。","院校匹配的红色提醒表示类型、版本、总分或小分可能不满足要求。","不要用模考分数代替正式送分；先锁定考试与复习周期。"])}<a class="link" href="profile.html">更新成绩、小分和考试版本 →</a>`),card("tests","TOEFL / IELTS 小分为什么重要",`<p>部分学校的规则不是“总分够了就可以”。例如 Caltech 的已核验规则会同时检查可接受考试、总分与每项最低分。</p><div class="callout">系统把“官方最低要求”和“竞争力参考”分开显示：前者会触发红色阻断，后者仅作为黄色提升建议。</div><a class="link" href="match.html">查看逐校门槛比对 →</a>`),card("profile","把活动转成可申请的证据",`<p>活动不是证书清单。招生材料更需要看见你持续投入、承担的角色、形成的成果，以及它与你的专业兴趣如何连接。</p>${list(["每次活动后记录：问题、你的行动、结果/数据、反思。","优先形成一条可持续主线，再用少量互补经历丰富它。","把论文、项目链接、演示、获奖证明或导师反馈及时放入背景库。"])}<a class="link" href="portfolio.html">整理背景库 →</a>`),card("profile","材料准备不是最后一刻的事",`<p>档案中已将成绩单、教师推荐、英文写作样本和特定学校课程基础拆开记录。</p>${list(["推荐人要尽早确认，并保留能够体现学术表现的具体实例。","非英语材料通常需由合规渠道翻译；不要自行替代学校规定的翻译方式。","专项材料必须按学院或专业页面二次确认，不要只看大学总申请页。"])}`),card("schools","选校与申请：先过门槛，再谈匹配",`<p>院校排序先处理国际生门槛与材料，再结合 ${e(track)} 的专业强项、GPA、标化、AP 和个人课程权重。</p>${list(["红色：关键门槛未满足，优先解决或调整院校定位。","黄色：规则待确认、竞争力或材料有提升空间。","绿色/普通：当前资料未出现明显硬性冲突，仍需申请季复核官网。"])}<a class="link" href="match.html">打开院校匹配 →</a>`),card("schools","本阶段的申请推进顺序",`<p>当前时间线最重要的任务是 <strong>${e(timelineFocus.title)}</strong>（${e(timelineFocus.window)}）。</p>${list([timelineFocus.details,"每完成一个子步骤后，在申请时间线中保存状态，系统会降低该项紧迫度并重排。","进入申请季前，把每所学校的截止日期、材料、资助和专业补充要求整理为独立清单。"])}<a class="link" href="timeline.html">回到时间线执行 →</a>`,true)];$("guide-intro").textContent=[profile.grade,profile.targetCountry,track].filter(Boolean).join(" · ");renderGuide()}async function loadGuide(token){try{const [profileResponse,analysisResponse,timelineResponse]=await Promise.all([fetch(`${AUTH_BASE_URL}/api/profile/me`,{headers:authHeaders(token)}),fetch(`${AUTH_BASE_URL}/api/planning/analysis`,{headers:authHeaders(token)}),fetch(`${AUTH_BASE_URL}/api/timeline`,{headers:authHeaders(token)})]);const [profileResult,analysisResult,timelineResult]=await Promise.all([profileResponse.json(),analysisResponse.json(),timelineResponse.json()]);if(profileResult.code!==200||analysisResult.code!==200||timelineResult.code!==200)throw new Error("个性化指南加载失败");buildGuide(profileResult.data,analysisResult.data,timelineResult.data)}catch(error){$("guide-grid").innerHTML=`<div class="empty">${e(error.message||"指南暂时无法加载")}</div>`}}$("guide-nav").addEventListener("click",event=>{const button=event.target.closest("button[data-topic]");if(!button)return;document.querySelectorAll("#guide-nav button").forEach(item=>item.classList.toggle("active",item===button));renderGuide(button.dataset.topic)});requireLogin((user,token)=>{renderAppLayout(user);loadGuide(token)});
</script></body></html>
