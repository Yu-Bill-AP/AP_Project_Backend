<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - AP Planner</title>

    <style>
        body {
            margin: 0;
            font-family: "PingFang SC", sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 360px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #e8eef4;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #dce5ee;
            font-size: 14px;
            box-sizing: border-box;
            color: #2c3e50;
            background-color: #ffffff;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image:
                linear-gradient(45deg, transparent 50%, #506172 50%),
                linear-gradient(135deg, #506172 50%, transparent 50%);
            background-position:
                calc(100% - 18px) calc(50% - 3px),
                calc(100% - 13px) calc(50% - 3px);
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            padding-right: 36px;
        }

        input:focus,
        select:focus {
            border-color: #2f6f9f;
            outline: none;
            box-shadow: 0 0 0 3px rgba(47,111,159,0.12);
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background-color: #2f6f9f;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #245d87;
        }

        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .message {
            min-height: 18px;
            font-size: 13px;
            margin-top: 8px;
        }

        .error {
            color: #d63031;
        }

        .success {
            color: #27ae60;
        }

        .footer {
            margin-top: 15px;
            font-size: 13px;
        }

        .footer a {
            color: #2f6f9f;
            text-decoration: none;
        }
    </style>
<link rel="preload" href="assets/fonts/NotebookHan-Common.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/handwriting.css?v=2">
<link rel="stylesheet" href="notebook.css?v=sheet-4-timeline">
<script src="notebook.js?v=sheet-2" defer></script>
</head>

<body data-notebook-page="register">

<div class="container">
    <h1><img src="assets/login/title.png" alt="AP Planner" width="300" height="64"></h1>
    <div class="subtitle">Sign up</div>

    <label class="register-label" for="username">Name</label>
    <input id="username" type="text" placeholder="Name (6–20 characters)" autocomplete="username">
    <label class="register-label" for="email">Email</label>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <label class="register-label" for="name">Full name</label>
    <input id="name" type="text" placeholder="Full name" autocomplete="name">

    <label class="register-label" for="current-grade-term">Current grade</label>
    <select id="current-grade-term">
        <option value="9年级上">Grade 9 · Fall</option>
        <option value="9年级下">Grade 9 · Spring</option>
        <option value="10年级上">Grade 10 · Fall</option>
        <option value="10年级下">Grade 10 · Spring</option>
        <option value="11年级上">Grade 11 · Fall</option>
        <option value="11年级下">Grade 11 · Spring</option>
        <option value="12年级上">Grade 12 · Fall</option>
        <option value="12年级下">Grade 12 · Spring</option>
    </select>

    <label class="register-label" for="password">Password</label>
    <input id="password" type="password" placeholder="Password (at least 8 characters)" autocomplete="new-password">
    <label class="register-label" for="confirm-password">Confirm password</label>
    <input id="confirm-password" type="password" placeholder="Confirm password" autocomplete="new-password">

    <button id="register-btn" onclick="register()">Sign up</button>

    <div id="message" class="message"></div>

    <div class="footer">
        Already have an account?<a href="login.html">Log in</a>
    </div>
</div>

<script src="auth.js"></script>
<script>
if (new URLSearchParams(window.location.search).get("preview") !== "1") redirectIfLoggedIn();

function buildRegisterPayload(username, email, name, password, currentGradeTerm) {
    return {
        username,
        email,
        password,
        name,
        current_grade_term: currentGradeTerm
    };
}

function showMessage(text, type) {
    const message = document.getElementById("message");
    message.textContent = text;
    message.className = `message ${type}`;
}

async function register() {
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const name = document.getElementById("name").value.trim();
    const currentGradeTerm = document.getElementById("current-grade-term").value;
    const password = document.getElementById("password").value.trim();
    const confirmPassword = document.getElementById("confirm-password").value.trim();
    const btn = document.getElementById("register-btn");

    showMessage("", "");

    if (!username || !email || !name || !password || !confirmPassword) {
        showMessage("请完整填写注册信息", "error");
        return;
    }

    if (username.length < 6 || username.length > 20) {
        showMessage("用户名需要为6-20位", "error");
        return;
    }

    if (!email.includes("@")) {
        showMessage("请输入有效邮箱", "error");
        return;
    }

    if (password.length < 8) {
        showMessage("密码至少需要8位", "error");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("两次输入的密码不一致", "error");
        return;
    }

    btn.textContent = "注册中...";
    btn.disabled = true;

    try {
        const response = await fetch(`${AUTH_BASE_URL}/api/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(
                buildRegisterPayload(username, email, name, password, currentGradeTerm)
            )
        });

        const data = await response.json();

        if (data.code !== 200) {
            showMessage(data.detail || data.msg || "注册失败", "error");
            return;
        }

        showMessage("注册成功，正在跳转登录页...", "success");
        setTimeout(() => {
            window.location.href = "login.html";
        }, 800);
    } catch (error) {
        showMessage("网络错误，请检查后端是否启动", "error");
    } finally {
        btn.textContent = "立即注册";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
