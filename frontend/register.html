<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - AP Planner</title>

    <style>
        body {
            margin: 0;
            font-family: "PingFang SC", sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 360px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            border-color: #3498db;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .message {
            min-height: 18px;
            font-size: 13px;
            margin-top: 8px;
        }

        .error {
            color: #d63031;
        }

        .success {
            color: #27ae60;
        }

        .footer {
            margin-top: 15px;
            font-size: 13px;
        }

        .footer a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>AP Planner</h1>
    <div class="subtitle">创建你的账号</div>

    <input id="username" type="text" placeholder="用户名（6-20位）">
    <input id="email" type="email" placeholder="邮箱">
    <input id="name" type="text" placeholder="真实姓名">

    <select id="current-grade-term">
        <option value="9年级上">9年级上</option>
        <option value="9年级下">9年级下</option>
        <option value="10年级上">10年级上</option>
        <option value="10年级下">10年级下</option>
        <option value="11年级上">11年级上</option>
        <option value="11年级下">11年级下</option>
        <option value="12年级上">12年级上</option>
        <option value="12年级下">12年级下</option>
    </select>

    <input id="password" type="password" placeholder="密码（至少8位）">
    <input id="confirm-password" type="password" placeholder="确认密码">

    <button id="register-btn" onclick="register()">立即注册</button>

    <div id="message" class="message"></div>

    <div class="footer">
        已有账号？<a href="login.html">去登录</a>
    </div>
</div>

<script src="auth.js"></script>
<script>
redirectIfLoggedIn();

function buildRegisterPayload(username, email, name, password, currentGradeTerm) {
    return {
        username,
        email,
        password,
        name,
        current_grade_term: currentGradeTerm
    };
}

function showMessage(text, type) {
    const message = document.getElementById("message");
    message.textContent = text;
    message.className = `message ${type}`;
}

async function register() {
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const name = document.getElementById("name").value.trim();
    const currentGradeTerm = document.getElementById("current-grade-term").value;
    const password = document.getElementById("password").value.trim();
    const confirmPassword = document.getElementById("confirm-password").value.trim();
    const btn = document.getElementById("register-btn");

    showMessage("", "");

    if (!username || !email || !name || !password || !confirmPassword) {
        showMessage("请完整填写注册信息", "error");
        return;
    }

    if (username.length < 6 || username.length > 20) {
        showMessage("用户名需要为6-20位", "error");
        return;
    }

    if (!email.includes("@")) {
        showMessage("请输入有效邮箱", "error");
        return;
    }

    if (password.length < 8) {
        showMessage("密码至少需要8位", "error");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("两次输入的密码不一致", "error");
        return;
    }

    btn.textContent = "注册中...";
    btn.disabled = true;

    try {
        const response = await fetch(`${AUTH_BASE_URL}/api/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(
                buildRegisterPayload(username, email, name, password, currentGradeTerm)
            )
        });

        const data = await response.json();

        if (data.code !== 200) {
            showMessage(data.detail || data.msg || "注册失败", "error");
            return;
        }

        showMessage("注册成功，正在跳转登录页...", "success");
        setTimeout(() => {
            window.location.href = "login.html";
        }, 800);
    } catch (error) {
        showMessage("网络错误，请检查后端是否启动", "error");
    } finally {
        btn.textContent = "立即注册";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
