<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Log in - AP Planner</title>
    <link rel="preload" as="image" href="assets/login/title.png">
    <link rel="stylesheet" href="login.css">
<link rel="preload" href="assets/fonts/NotebookHan-Common.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/handwriting.css?v=2">
<link rel="stylesheet" href="notebook.css?v=sheet-4-timeline">
<script src="notebook.js?v=sheet-2" defer></script>
</head>
<body data-notebook-page="login">
    <main class="scene-host" aria-label="AP Planner login">
        <div class="scene" id="scene">
            <div class="drawing" id="drawing">
                <h1 class="title"><img src="assets/login/title.png" alt="AP PLANNER" width="806" height="172"></h1>
                <form id="login-form" aria-label="Log in" novalidate>
                    <label class="name-label" for="username">
                        <span class="sr-only">Name</span>
                        <img src="assets/login/name.png" alt="" width="179" height="54">
                    </label>
                    <img class="name-line" src="assets/login/name-line.png" alt="" width="345" height="24">
                    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="error-msg">
                    <label class="password-label" for="password">
                        <span class="sr-only">Password</span>
                        <img src="assets/login/password.png" alt="" width="277" height="55">
                    </label>
                    <img class="password-line" src="assets/login/password-line.png" alt="" width="261" height="26">
                    <input id="password" name="password" type="text" autocomplete="current-password" autocapitalize="none" spellcheck="false" required aria-describedby="error-msg">
                    <img class="cat" src="assets/login/cat.png" alt="" width="116" height="110">
                    <button id="login-btn" class="login-button" type="submit" aria-label="Log in">
                        <img src="assets/login/login.png" alt="" width="340" height="137">
                    </button>
                    <p id="error-msg" class="message" role="alert" aria-live="polite"></p>
                    <p class="register">No account? <a id="register-link" href="register.html">Sign up</a></p>
                </form>
            </div>

        </div>
    </main>
    <aside class="help-wrap">
        <button id="help-btn" class="help-button" type="button" aria-label="Help" aria-controls="help-panel" aria-expanded="false">?</button>
        <div id="help-panel" class="help-panel" role="region" aria-label="Login help" hidden>
            Log in to complete your profile, find matching universities, and plan your next steps.
        </div>
    </aside>
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
